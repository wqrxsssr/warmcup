<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WarmCup — Регистрация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@400;500;600;700&family=Galada&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="welcome-body">

    <img src="assets/coffee-beans-left.png" alt="" class="beans beans-left">
    <img src="assets/coffee-beans-right.png" alt="" class="beans beans-right">

    <main class="welcome-page">
        <div class="welcome-content">
            <h1 class="welcome-logo">WarmCup</h1>
            <p class="welcome-title">Регистрация</p>

            <form class="auth-form">
                <input type="text" placeholder="Логин" class="auth-input">
                <input type="email" placeholder="Почта" class="auth-input">
                <input type="password" placeholder="Пароль" class="auth-input">
                <button type="submit" class="auth-submit">Зарегистрироваться</button>
            </form>
        </div>

        <footer class="welcome-footer">
            Уже есть аккаунт?<br>
            <a href="login.html" class="footer-link">Войти</a>
        </footer>
    </main>

</html>
